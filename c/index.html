<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Computing Lectures · Course Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--side:#f6f5f1;--ink:#1b1c20;--mute:#71727c;--line:#e7e5de;--hi:#fff3c4;--acc:#b4402a}
@media (prefers-color-scheme:dark){:root{--bg:#141518;--side:#1b1c20;--ink:#e8e7e3;--mute:#9a9ba5;--line:#2b2c32;--hi:#3a331a;--acc:#ff8a70}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 "Inter Tight",system-ui,sans-serif;display:grid;grid-template-columns:320px 1fr;grid-template-rows:56px 1fr;height:100vh}
a{color:var(--acc)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line)}
.top .brand{font-family:"Source Serif 4",serif;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top nav{margin-left:auto;display:flex;gap:4px}
.top nav a{color:var(--mute);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:7px}
.top nav a.on,.top nav a:hover{background:var(--side);color:var(--ink)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:7px;color:var(--ink);font-size:16px;padding:4px 9px;cursor:pointer}
aside{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:12px 10px 40px}
.prog{font-size:12.5px;color:var(--mute);padding:4px 10px 10px}
.prog .bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--acc)}
details.ch{margin:2px 0}
details.ch summary{list-style:none;cursor:pointer;padding:9px 10px;border-radius:8px;font-weight:600;font-size:14.5px;display:flex;gap:9px;align-items:center}
details.ch summary::-webkit-details-marker{display:none}
details.ch summary:hover{background:var(--bg)}
details.ch summary .dot{width:8px;height:8px;border-radius:50%;flex:none}
details.ch summary .n{margin-left:auto;font-weight:400;color:var(--mute);font-size:12.5px}
.ls a{display:flex;gap:10px;padding:6px 10px 6px 27px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.35}
.ls a span{color:var(--mute);font-size:12px;min-width:30px;padding-top:1px}
.ls a.seen span::after{content:" ✓";color:var(--acc)}
.ls a:hover{background:var(--bg)}.ls a.on{background:var(--hi)}
main{overflow:auto;min-width:0}
.inner{max-width:1000px;margin:0 auto;padding:26px 28px 70px}
.crumb{font-size:13px;color:var(--mute)}
h1{font-family:"Source Serif 4",serif;font-size:clamp(26px,3.4vw,38px);line-height:1.12;margin:6px 0 16px}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.novideo{aspect-ratio:16/9;border-radius:12px;background:var(--side);display:grid;place-items:center;color:var(--mute)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 0}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:500 14.5px "Inter Tight";color:var(--mute);cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.pane{padding:16px 0;overflow-wrap:anywhere}
.pane h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:18px 0 4px}
.pane ul,.pane ol{padding-left:22px}.pane img{max-width:100%;height:auto;border-radius:6px;background:#fff}
.pdf{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pick button,.pick a{font:500 13.5px "Inter Tight";border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer;text-decoration:none}
.pick button.on{border-color:var(--acc);color:var(--acc)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
.pn a{text-decoration:none;color:var(--ink);max-width:48%;font-size:14.5px}
.pn a small{display:block;color:var(--mute);font-size:12px}
.pn a:last-child{text-align:right;margin-left:auto}
.page h2{font-family:"Source Serif 4",serif;font-size:30px;margin:0 0 10px}
.home .tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:20px}
.home .tr a{display:block;padding:16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);border-top:4px solid var(--c)}
.home .tr a b{display:block;font-size:16px}.home .tr a small{color:var(--mute)}
.talk{display:grid;grid-template-columns:130px 140px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.talk span{color:var(--mute)}
@media (max-width:860px){
 body{grid-template-columns:1fr}
 aside{position:fixed;top:56px;bottom:0;left:0;width:86vw;max-width:340px;z-index:9;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
 body.nav aside{transform:none}.burger{display:block}.top nav{display:none}
 .inner{padding:18px 16px 60px}.talk{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top"><button class="burger" onclick="document.body.classList.toggle('nav')" aria-label="Menu">☰</button><div class="brand">A Gentle Introduction to Quantum Computing</div>
<nav><a href="#/">Overview</a><a href="#/talks">Seminar</a><a href="#/syllabus">Syllabus</a><a href="#/practice">Practice</a><a href="#/projects">Projects</a></nav></div>
<aside id="side"></aside>
<main id="main"></main>
<script src="../shared.js"></script>
<script>
const {load,COLORS,label,thumb,embed,drivePreview,fmtDate,esc}=QC;
let D,seen=new Set();
try{seen=new Set(JSON.parse(localStorage.getItem("qc-seen")||"[]"))}catch(e){}
const saveSeen=()=>{try{localStorage.setItem("qc-seen",JSON.stringify([...seen]))}catch(e){}};
// Chapters follow the tracks, lectures in course order inside each.
load("../").then(d=>{D=d;
  D.chapters=D.tracks.map(t=>({...t,ls:D.ordered.filter(l=>l.track===t.id)}));
  D.flat=D.chapters.flatMap(c=>c.ls);
  addEventListener("hashchange",route);route();
});
function side(cur){
  const pct=Math.round(100*seen.size/D.flat.length);
  side_.innerHTML=`<div class="prog">${seen.size} of ${D.flat.length} watched<div class="bar"><i style="width:${pct}%"></i></div></div>`+
   D.chapters.map(c=>`<details class="ch" ${cur&&cur.track===c.id?"open":""}><summary><i class="dot" style="background:${COLORS[c.id]}"></i>${esc(c.name)}<span class="n">${c.ls.length}</span></summary>
   <div class="ls">${c.ls.map(l=>`<a href="#/l/${l.id}" class="${cur&&cur.id===l.id?"on":""} ${seen.has(l.id)?"seen":""}"><span>${l.num??l.id}</span>${esc(l.title)}</a>`).join("")}</div></details>`).join("");
  const on=side_.querySelector("a.on");if(on)on.scrollIntoView({block:"nearest"});
}
const side_=document.getElementById("side");
function route(){
  document.body.classList.remove("nav");
  const h=location.hash.slice(1)||"/";const m=h.match(/^\/l\/(\w+)/);
  document.querySelectorAll(".top nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+h));
  if(m&&D.byId[m[1]])return lesson(D.byId[m[1]]);
  side(null);main.scrollTop=0;
  const P={"/talks":talks,"/syllabus":()=>page("Syllabus",D.syllabus+"<h4>Still on the list</h4>"+D.syllabus_pending),"/practice":()=>page("Challenges and resources",D.resources+"<h4>More exercise sets</h4>"+D.homework_resources),"/projects":projects};
  (P[h]||home)();
}
function home(){
  const first=D.flat.find(l=>!seen.has(l.id))||D.flat[0];
  main.innerHTML=`<div class="inner home"><div class="crumb">Nov 2021 – Aug 2023 · ${D.lectures.filter(l=>l.video).length} recordings · ${D.lectures.filter(l=>l.homework).length} homework sets</div>
  <h1>Learn quantum computing the way we did: one lecture at a time.</h1>
  <p style="color:var(--mute);max-width:640px">The lectures are grouped into chapters. Start at the top, or jump to any topic. Your progress is saved in this browser.</p>
  <p><a class="" href="#/l/${first.id}" style="display:inline-block;background:var(--acc);color:#fff;text-decoration:none;padding:10px 16px;border-radius:9px;font-weight:600">${seen.size?"Continue":"Start"}: ${esc(first.title)} →</a></p>
  <div class="tr">${D.chapters.map(c=>`<a href="#/l/${c.ls[0].id}" style="--c:${COLORS[c.id]}"><b>${esc(c.name)}</b><small>${esc(c.blurb)} · ${c.ls.length} lectures</small></a>`).join("")}</div></div>`;
}
function lesson(l){
  seen.add(l.id);saveSeen();side(l);
  const i=D.flat.indexOf(l),prev=D.flat[i-1],next=D.flat[i+1],t=D.trackById[l.track];
  const pdfs=l.notes.filter(n=>n.id&&n.kind==="PDF");
  const tabs=[l.homework&&["hw","Homework"],pdfs.length&&["notes","Notes"],l.notes.some(n=>!(n.id&&n.kind==="PDF"))&&["links","Links"]].filter(Boolean);
  main.innerHTML=`<div class="inner"><div class="crumb">${esc(t.name)} · ${label(l)}${l.presenter?" · "+esc(l.presenter):""}${l.date?" · "+fmtDate(l.date):""}</div>
  <h1>${esc(l.title)}</h1>
  ${l.yt?`<iframe class="video" src="${embed(l)}" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`:`<div class="novideo">${esc(l.note||"No recording")}</div>`}
  ${tabs.length?`<div class="tabs" id="tb">${tabs.map(([k,v],j)=>`<button data-k="${k}" class="${j?"":"on"}">${v}</button>`).join("")}</div><div class="pane" id="pane"></div>`:""}
  <div class="pn">${prev?`<a href="#/l/${prev.id}"><small>← Previous</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a href="#/l/${next.id}"><small>Next →</small>${esc(next.title)}</a>`:""}</div></div>`;
  main.scrollTop=0;
  const show=k=>{document.querySelectorAll("#tb button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
    if(k==="hw")pane.innerHTML=`${l.assigned?`<p style="color:var(--mute)">Assigned ${fmtDate(l.assigned)} · due ${fmtDate(l.due)}</p>`:""}${l.homework_shared_with.length?`<p style="color:var(--mute)">Shared with lecture ${l.homework_shared_with.join(", ")}</p>`:""}${l.homework}`;
    if(k==="notes"){pane.innerHTML=`<div class="pick">${pdfs.map((n,j)=>`<button data-j="${j}" class="${j?"":"on"}">${esc(n.label)}</button>`).join("")}<a href="${pdfs[0].url}" target="_blank" rel="noopener" id="od">Open in Drive ↗</a></div><iframe class="pdf" id="pf" src="${drivePreview(pdfs[0])}"></iframe>`;
      pane.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{pane.querySelectorAll("[data-j]").forEach(x=>x.classList.toggle("on",x===b));pf.src=drivePreview(pdfs[b.dataset.j]);od.href=pdfs[b.dataset.j].url})}
    if(k==="links")pane.innerHTML=`<div class="pick">${l.video?`<a href="${l.video}" target="_blank" rel="noopener">YouTube ↗</a>`:""}${l.notes.filter(n=>!(n.id&&n.kind==="PDF")).map(n=>`<a href="${n.url}" target="_blank" rel="noopener">${esc(n.label)} ↗</a>`).join("")}</div>`;
  };
  if(tabs.length){tb.onclick=e=>{const k=e.target.dataset.k;if(k)show(k)};show(tabs[0][0])}
}
function page(title,htmlStr){main.innerHTML=`<div class="inner page pane"><h2>${esc(title)}</h2>${htmlStr}</div>`}
function talks(){
  main.innerHTML=`<div class="inner page"><h2>The research seminar</h2><p style="color:var(--mute)">From December 2022 the series ran as the Quantum Computing Academic Assembly, a weekly seminar of paper readings and members' own research.</p>
  ${D.talks.map(t=>{const lec=D.lectures.find(l=>l.date&&new Date(l.date+"T12:00").toDateString()===new Date(t.date+" 12:00").toDateString());
   return `<div class="talk"><span>${esc(t.date)}</span><b>${esc(t.presenter)}</b><div>${esc(t.topic)}${t.links.map(x=>`<br><a href="${x.url}" target="_blank" rel="noopener" style="font-size:13.5px">${esc(x.text.slice(0,90))}</a>`).join("")}${lec?`<br><a href="#/l/${lec.id}" style="font-size:13.5px">▶ Watch the recording</a>`:""}</div></div>`}).join("")}
  <h4 style="font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin-top:30px">Topics we wanted to cover next</h4><div class="pane">${D.potential_topics}</div></div>`;
}
function projects(){
  page("Projects and write-ups",D.projects.map(p=>p.group?`<h4>${esc(p.group)}</h4>${p.items.map(i=>`<a href="${i.url}" target="_blank" rel="noopener">${esc(i.name)}</a>`).join("<br>")}`:`<h4>${esc(p.name)}</h4><a href="${p.url}" target="_blank" rel="noopener">Open ↗</a>`).join("")+`<h4>QOSF challenge write-ups</h4>${D.writeups.map(i=>`<a href="${i.url}" target="_blank" rel="noopener">${esc(i.name)}</a>`).join("<br>")}`);
}
</script>
</body>
</html>
