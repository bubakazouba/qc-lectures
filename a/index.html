<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Computing Lectures · Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#17171a;--mute:#6b6b74;--line:#e4e2db;--accent:#2f4bd8;--chip:#efede6}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--card:#1a1b1f;--ink:#ececef;--mute:#9a9aa6;--line:#2a2b31;--accent:#8ea2ff;--chip:#22232a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{padding:56px 0 28px;border-bottom:1px solid var(--line)}
h1{font-family:Fraunces,serif;font-weight:700;font-size:clamp(34px,5vw,58px);line-height:1.04;margin:0 0 14px;letter-spacing:-.01em}
.lede{max-width:680px;color:var(--mute);font-size:18px;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:28px}
.stat b{display:block;font-family:Fraunces,serif;font-size:30px;line-height:1}
.stat span{color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
nav.tabs{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:var(--mute);font:500 15px "IBM Plex Sans";padding:14px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:24px 0 18px}
.search{flex:1 1 260px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px "IBM Plex Sans";cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.thumb{aspect-ratio:16/9;background:#000 center/cover;position:relative}
.thumb .num{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.72);color:#fff;font:600 12px "IBM Plex Sans";padding:3px 8px;border-radius:6px}
.thumb.none{background:repeating-linear-gradient(45deg,var(--chip),var(--chip) 10px,var(--card) 10px,var(--card) 20px);display:grid;place-items:center;color:var(--mute);font-size:13px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0;font-size:16px;line-height:1.3;font-weight:600}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--mute)}
.tag.t{color:#fff}
dialog{border:0;padding:0;border-radius:16px;width:min(980px,96vw);max-height:92vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,10,14,.6)}
.dlg{display:flex;flex-direction:column;max-height:92vh}
.dhead{display:flex;justify-content:space-between;align-items:start;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-family:Fraunces,serif;font-size:26px;line-height:1.15}
.dhead small{color:var(--mute)}
.x{background:var(--chip);border:0;border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--ink);flex:none}
.dbody{overflow:auto;padding:18px 22px 26px}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:10px;background:#000}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;text-decoration:none;color:var(--ink);font-size:14px;background:var(--bg);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--ink)}
.pdf{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.hw{overflow-wrap:anywhere;border-top:1px solid var(--line);margin-top:18px;padding-top:6px}
.hw h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 6px}
.hw img{max-width:100%;height:auto;border-radius:6px;background:#fff}
.hw ul,.hw ol{padding-left:22px}.hw li{margin:3px 0}
.prose{overflow-wrap:anywhere;max-width:820px;padding:10px 0 60px}.prose h4{margin:22px 0 6px}
.prose ol,.prose ul{padding-left:22px}
table.talks{width:100%;border-collapse:collapse;margin:20px 0 60px;font-size:15px}
.talks td,.talks th{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.talks th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.talks td:first-child{white-space:nowrap;color:var(--mute)}
.proj{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:20px 0 60px}
.proj div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.proj h3{margin:0 0 8px;font-size:15px}
.proj a{display:block;font-size:14px;margin:4px 0}
footer{color:var(--mute);font-size:13px;padding:30px 0 50px;border-top:1px solid var(--line)}
@media (max-width:600px){header{padding-top:36px}.dhead,.dbody{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>A Gentle Introduction to<br>Quantum Computing</h1>
  <p class="lede">A free lecture series that started with software engineers learning from scratch and grew into a weekly research seminar. Every recording, set of notes and homework, in one place.</p>
  <div class="stats" id="stats"></div>
</div></header>
<nav class="tabs"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"></main>
<footer><div class="wrap">Source: the <a id="drive" href="#">original Drive folder</a> · <a id="gh" href="#">GitHub</a></div></footer>
<dialog id="dlg"></dialog>
<script src="../shared.js"></script>
<script>
const {load,COLORS,label,thumb,embed,drivePreview,fmtDate,esc}=QC;
let D, state={tab:"lectures",q:"",track:null};
const TABS=[["lectures","Lectures"],["talks","Seminar talks"],["syllabus","Syllabus"],["practice","Practice"],["projects","Projects"]];
load("../").then(d=>{D=d;
  drive.href=D.drive;gh.href=D.github;
  const n=D.lectures, notes=n.reduce((s,l)=>s+l.notes.filter(x=>x.kind==="PDF").length,0);
  stats.innerHTML=[[n.filter(l=>l.video).length,"recordings"],[notes,"PDF notes"],[n.filter(l=>l.homework).length,"homework sets"],["2021–23","Nov to Aug"]].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
  tabs.innerHTML=TABS.map(([k,v])=>`<button data-k="${k}">${v}</button>`).join("");
  tabs.onclick=e=>{const k=e.target.dataset.k;if(k){state.tab=k;render()}};
  render();
  const m=location.hash.match(/^#L(\w+)$/);if(m&&D.byId[m[1]])openL(m[1]);
});
function render(){
  [...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.k===state.tab));
  ({lectures:renderLectures,talks:renderTalks,syllabus:renderSyl,practice:renderPractice,projects:renderProjects})[state.tab]();
}
function renderLectures(){
  main.innerHTML=`<div class="toolbar"><input class="search" id="q" placeholder="Search lectures, e.g. toric, Grover, QAOA" value="${esc(state.q)}"></div>
  <div class="chips" id="chips"><button class="chip ${!state.track?"on":""}" data-t="">All</button>${D.tracks.map(t=>`<button class="chip ${state.track===t.id?"on":""}" data-t="${t.id}"><i style="background:${COLORS[t.id]}"></i>${esc(t.name)}</button>`).join("")}</div>
  <div class="grid" id="grid"></div>`;
  q.oninput=()=>{state.q=q.value;drawGrid()};
  chips.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;state.track=b.dataset.t||null;[...chips.children].forEach(c=>c.classList.toggle("on",c===b));drawGrid()};
  drawGrid();
}
function drawGrid(){
  const q=state.q.trim().toLowerCase();
  const list=D.ordered.filter(l=>(!state.track||l.track===state.track)&&(!q||(l.title+" "+label(l)+" "+(l.presenter||"")+" "+D.trackById[l.track].name).toLowerCase().includes(q)));
  grid.innerHTML=list.map(l=>{const t=D.trackById[l.track],th=thumb(l);
    return `<button class="card" data-id="${l.id}">
      <div class="thumb ${th?"":"none"}" style="${th?`background-image:url(${th})`:""}"><span class="num">${label(l)}</span>${th?"":esc(l.note||"No recording")}</div>
      <div class="body"><h3>${esc(l.title)}</h3>
      <div class="meta"><span class="tag t" style="background:${COLORS[l.track]}">${esc(t.name)}</span>
      ${l.notes.some(n=>n.kind==="PDF")?'<span class="tag">Notes</span>':""}${l.homework?'<span class="tag">Homework</span>':""}${l.presenter?`<span class="tag">${esc(l.presenter)}</span>`:""}</div></div></button>`}).join("")||`<p style="color:var(--mute)">Nothing matches.</p>`;
  grid.onclick=e=>{const c=e.target.closest(".card");if(c)openL(c.dataset.id)};
}
function openL(id){
  const l=D.byId[id],t=D.trackById[l.track];history.replaceState(null,"","#L"+id);
  const sub=[label(l),t.name,l.presenter,fmtDate(l.date)].filter(Boolean).map(esc).join(" · ");
  dlg.innerHTML=`<div class="dlg"><div class="dhead"><div><small>${sub}</small><h2>${esc(l.title)}</h2></div><button class="x" onclick="dlg.close()" aria-label="Close">×</button></div>
  <div class="dbody">${embed(l)?`<iframe class="video" src="${embed(l)}" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`:`<p style="color:var(--mute)">${esc(l.note||"No recording")}</p>`}
  <div class="links">${l.video?`<a class="btn" href="${l.video}" target="_blank" rel="noopener">▶ YouTube</a>`:""}${l.notes.map((n,i)=>n.id&&n.kind==="PDF"?`<button class="btn" data-pdf="${i}">📄 ${esc(n.label)}</button>`:`<a class="btn" href="${n.url}" target="_blank" rel="noopener">↗ ${esc(n.label)}</a>`).join("")}</div>
  <div id="pdfbox"></div>
  ${l.homework?`<div class="hw">${l.homework_shared_with.length?`<p style="color:var(--mute)">Shared with lecture ${l.homework_shared_with.join(", ")}</p>`:""}${l.assigned?`<p style="color:var(--mute)">Assigned ${fmtDate(l.assigned)} · due ${fmtDate(l.due)}</p>`:""}${l.homework}</div>`:""}</div></div>`;
  dlg.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>{const n=l.notes[b.dataset.pdf];pdfbox.innerHTML=`<iframe class="pdf" src="${drivePreview(n)}"></iframe><p><a href="${n.url}" target="_blank" rel="noopener">Open in Drive ↗</a></p>`});
  dlg.showModal();
}
dlg.addEventListener("close",()=>{dlg.innerHTML="";history.replaceState(null,"",location.pathname)});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
function renderTalks(){
  main.innerHTML=`<div class="prose" style="padding-bottom:0"><h2 style="font-family:Fraunces,serif">Quantum Computing Academic Assembly</h2><p style="color:var(--mute)">From late 2022 the series became a weekly seminar where members presented papers and their own research.</p></div>
  <table class="talks"><tr><th>Date</th><th>Presenter</th><th>Topic</th></tr>${D.talks.map(t=>{const lec=D.lectures.find(l=>l.date&&fmtDate(l.date)===new Date(t.date).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}));
    return `<tr><td>${esc(t.date)}</td><td>${esc(t.presenter)}</td><td>${esc(t.topic)}${t.links.length?`<br>${t.links.map(x=>`<a href="${x.url}" target="_blank" rel="noopener" style="font-size:14px">${esc(x.text.slice(0,90))}</a>`).join("<br>")}`:""}${lec?`<br><a href="#L${lec.id}" onclick="openL('${lec.id}');return false" style="font-size:14px">▶ Watch ${label(lec)}</a>`:""}</td></tr>`}).join("")}</table>
  <div class="prose"><h3>Topics we wanted to cover next</h3>${D.potential_topics}</div>`;
}
function renderSyl(){main.innerHTML=`<div class="prose"><h2 style="font-family:Fraunces,serif">Quantum Computing 101: the syllabus</h2>${D.syllabus}<h3>Still on the list</h3>${D.syllabus_pending}</div>`}
function renderPractice(){main.innerHTML=`<div class="prose"><h2 style="font-family:Fraunces,serif">Challenges and resources</h2>${D.resources}<h3>Going further: exercise sets</h3>${D.homework_resources}</div>`}
function renderProjects(){
  main.innerHTML=`<div class="prose" style="padding-bottom:0"><h2 style="font-family:Fraunces,serif">Projects and write-ups</h2><p style="color:var(--mute)">Research projects that came out of the series, including contributions to the Mitiq error-mitigation library.</p></div>
  <div class="proj">${D.projects.map(p=>p.group?`<div><h3>${esc(p.group)}</h3>${p.items.map(i=>`<a href="${i.url}" target="_blank" rel="noopener">${esc(i.name)}</a>`).join("")}</div>`:`<div><h3>${esc(p.name)}</h3><a href="${p.url}" target="_blank" rel="noopener">Open ↗</a></div>`).join("")}
  <div><h3>QOSF challenge write-ups</h3>${D.writeups.map(i=>`<a href="${i.url}" target="_blank" rel="noopener">${esc(i.name)}</a>`).join("")}</div></div>`;
}
</script>
</body>
</html>
